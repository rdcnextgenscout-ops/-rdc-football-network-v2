<main>

<div class="box">

<h2>💰 NGA Value</h2>

<p>
Prototype d'estimation de la valeur de marché d'un joueur.
</p>

<label>NGA Score</label>

<input id="score" type="number" min="0" max="100" value="50">

<label>Âge</label>

<input id="age" type="number" min="14" max="40" value="18">

<button onclick="calculateValue()">
Estimer la valeur
</button>

<div class="value">

<p>NGA VALUE</p>

<strong id="result">50 000 €</strong>

</div>

</div>

</main>

<script>

function calculateValue(){

let score=
Number(document.getElementById("score").value);

let age=
Number(document.getElementById("age").value);

let value=score*1000;

if(age<=20){

value*=1.5;

}

else if(age<=23){

value*=1.2;

}

value=Math.round(value);

document.getElementById("result").textContent=
value.toLocaleString("fr-FR")+" €";

}

</script>
